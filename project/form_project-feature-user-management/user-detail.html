<!DOCTYPE html>
<!--
  user-detail.html
  使用者詳情頁。
  從 URL 帶 ?id=<userId> 進來。
  API：getUser (載入時)
-->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniAccess - 使用者詳情</title>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/users.css" />
</head>
<body>

  <section class="canvas has-decor">

    <div class="top-logo"><img src="images/logo.png" class="top-logo-img" alt="UniAccess"></div>
    <div class="top-search">
      <img src="images/icons/search.png" class="search-icon-img" alt=""><input />
    </div>
    <div class="top-small-box"></div>
    <div class="top-icons">
      <button class="top-icon" id="homeBtn"><img src="images/icons/home.png" class="top-icon-img" alt=""></button>
      <button class="top-icon" id="profileBtn"><img src="images/icons/user.png" class="top-icon-img" alt=""></button>
    </div>
    <div id="profileMenu" class="profile-menu hidden">
      <div><img src="images/icons/settings.png" class="small-icon-img" alt=""> 設定</div>
      <div id="logoutMenuBtn"><img src="images/icons/logout.png" class="small-icon-img" alt=""> 登出</div>
      <div><img src="images/icons/question.png" class="small-icon-img" alt=""> 問題與回報</div>
    </div>

    <div class="left-tabs">
      <div class="tab-piece"></div><div class="tab-piece"></div><div class="tab-piece"></div>
      <div class="tab-piece"></div><div class="tab-piece"></div><div class="tab-piece"></div>
      <div class="tab-piece"></div><div class="tab-piece"></div><div class="tab-piece"></div>
      <div class="tab-piece"></div><div class="tab-piece"></div>
    </div>

    <main class="main-panel">
      <div class="page-toolbar">
        <button id="backBtn" class="btn-pill">返回</button>
      </div>

      <div class="detail-grid">
        <div id="detailText" class="detail-text"></div>
        <div class="vpn-card-grid">
          <div class="vpn-card"></div><div class="vpn-card"></div>
          <div class="vpn-card"></div><div class="vpn-card"></div>
          <div class="vpn-card"></div><div class="vpn-card"></div>
        </div>
      </div>
    </main>

    <aside class="right-side">
      <div class="notice-box">通知</div>
      <div class="right-dark-box"></div>
    </aside>

  </section>

  <script type="module" src="js/pages/user-detail.js"></script>
</body>
</html>
